name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Squash-merging makes the PR title + body the commit message, and
  # semantic-release reads a release-control token anywhere in that body. So
  # this has to run BEFORE the merge — afterwards the package is already
  # published and npm versions are immutable.
  release-tokens:
    name: Commit message cannot trigger an unintended release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check PR title + body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s' "$PR_TITLE" "$PR_BODY" | node scripts/check-release-tokens.mjs

  build-test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the build stamp counts commits with
          # `git rev-list --count HEAD`, and the default depth of 1 would make
          # every CI build report a count of 1 — wrong, but plausible enough to
          # be believed, which is the failure the stamp exists to prevent.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Docs integrity (links, agent-file symlinks, index coverage)
        run: pnpm check:docs

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (TS workspace + optional native)
        run: pnpm build

      - name: Test (default — native path when built)
        run: pnpm test

      - name: Test (TS fallback path)
        env:
          MCP_DISABLE_NATIVE: "1"
        run: pnpm test:no-native

      - name: Install usage(1) via mise
        # The freshness gate (next step) shells out to usage(1) to
        # regenerate completions + manpage + docs; mise pulls a pinned
        # binary so the check is reproducible across runners.
        uses: jdx/mise-action@v4

      - name: Check usage(1) artifacts are fresh vs .usage.kdl
        # Fails the build if completions/, man/, or docs/cli/ drifted
        # since the last regen. Fix locally: `pnpm artifacts && git add
        # completions/ man/ docs/cli/`. Bypass: edit .usage.kdl + this
        # check together in the same PR.
        run: pnpm --filter "@george43g/*-mcp" check:usage

      - name: Verify npm tarball is publishable
        run: pnpm --filter "@george43g/*-mcp" exec npm pack --dry-run

      - name: Stress harness (13 assertions including HTTP)
        run: pnpm --filter "@george43g/*-mcp" stress

      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-report-${{ matrix.os }}
          path: apps/**/stress-*-report.json
          if-no-files-found: ignore
