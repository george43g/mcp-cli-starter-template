# mise — toolchain pin + task runner.
#
# `mise install` bootstraps a fresh clone (installs the pinned node + pnpm).
# `mise run <task>` invokes a named task with proper dep ordering.
# Replaces .nvmrc / .node-version / Volta; package.json's "packageManager"
# remains the source-of-truth for corepack-aware tools.
#
# Docs: https://mise.jdx.dev

[tools]
node = "24"
pnpm = "10.29.3"
# `usage` (https://usage.jdx.dev) generates bash/zsh/fish completions +
# manpage + markdown docs from the .usage.kdl specs in apps/scaffolder/
# and apps/{{name}}-mcp/. Required by `mise run docs`/`completions`/
# `manpage` and by the cli-artifacts-drift CI gate.
usage = "latest"

[env]
# Default to non-dev mode unless overridden. Test runs flip it via .env.test.
MCP_DEV = "0"

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install"

[tasks.build]
description = "Turbo: build all packages (TS + optional native)"
depends = ["install"]
run = "pnpm build"

[tasks.dev]
description = "Turbo: watch mode across packages"
run = "pnpm dev"

[tasks.test]
description = "Run all tests"
run = "pnpm test"

[tasks.lint]
description = "Biome check"
run = "pnpm lint"

[tasks.typecheck]
description = "Typecheck every package"
run = "pnpm typecheck"

[tasks.verify]
description = "lint + typecheck + test + build (CI shape)"
run = "pnpm verify"

[tasks.stress]
description = "Run the 9-case MCP stress harness"
depends = ["build"]
run = "pnpm stress"

[tasks.screenshots]
description = "Regenerate TUI/CLI screenshots via VHS"
run = "pnpm --filter @george43g/{{name}}-mcp screenshots"

[tasks.docs]
description = "Generate CLI completions + markdown docs via usage"
run = """
  usage g completion bash apps/{{name}}-mcp/.usage.kdl > completions/_{{name}}.bash
  usage g completion zsh apps/{{name}}-mcp/.usage.kdl > completions/_{{name}}.zsh
  usage g completion fish apps/{{name}}-mcp/.usage.kdl > completions/_{{name}}.fish
  usage g markdown apps/{{name}}-mcp/.usage.kdl --out-dir docs/cli/
"""

[tasks.rename]
description = "Rename this template (replaces {{name}} placeholders, self-deletes script)"
run = "node scripts/init-template.mjs {{ arg(name=\"name\") }}"
# Example: mise run rename -- --name foo-mcp --scope @myorg
