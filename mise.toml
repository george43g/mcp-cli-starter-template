# mise — toolchain pin + task runner.
#
# `mise install` bootstraps a fresh clone (installs the pinned node + pnpm).
# `mise run <task>` invokes a named task with proper dep ordering.
# Replaces .nvmrc / .node-version / Volta; package.json's "packageManager"
# remains the source-of-truth for corepack-aware tools.
#
# Docs: https://mise.jdx.dev

[tools]
node = "24"
pnpm = "10.29.3"
# `usage` (https://usage.jdx.dev) generates bash/zsh/fish completions +
# manpage + markdown docs from the .usage.kdl specs in apps/scaffolder/
# and apps/example-repo-mcp/. Required by `mise run docs`/`completions`/
# `manpage` and by the cli-artifacts-drift CI gate.
# Pinned: usage(1) emits slightly different completion shells between
# minor versions; a floating "latest" makes the drift gates flap.
usage = "3.3.0"
# `actionlint` parses workflow YAML, checks expression syntax and shell
# snippets, and catches typo'd `runs-on`/`uses` values. Nothing else in this
# repo parses these files, so before this a malformed workflow was only
# discoverable by pushing it. Validating release-packages.yml by hand once
# required installing pyyaml into a scratch venv, which is the tell.
actionlint = "1.7.7"

[env]
# Default to non-dev mode unless overridden. Test runs flip it via .env.test.
MCP_DEV = "0"

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install"

[tasks.build]
description = "Turbo: build all packages (TS + optional native)"
depends = ["install"]
run = "pnpm build"

[tasks.dev]
description = "Turbo: watch mode across packages"
run = "pnpm dev"

[tasks.test]
description = "Run all tests"
run = "pnpm test"

[tasks.lint]
description = "Biome check"
run = "pnpm lint"

[tasks.typecheck]
description = "Typecheck every package"
run = "pnpm typecheck"

[tasks.verify]
description = "lint + typecheck + test + build (CI shape)"
run = "pnpm verify"

[tasks.stress]
description = "Run the 13-assertion MCP stress harness"
depends = ["build"]
run = "pnpm stress"

[tasks.screenshots]
description = "Regenerate TUI/CLI screenshots via VHS"
run = "pnpm --filter @george43g/example-repo-mcp screenshots"

[tasks.docs]
description = "Generate CLI completions + markdown docs via usage"
run = """
  usage g completion bash apps/example-repo-mcp/.usage.kdl > completions/_example-repo.bash
  usage g completion zsh apps/example-repo-mcp/.usage.kdl > completions/_example-repo.zsh
  usage g completion fish apps/example-repo-mcp/.usage.kdl > completions/_example-repo.fish
  usage g markdown apps/example-repo-mcp/.usage.kdl --out-dir docs/cli/
"""

[tasks.rename]
description = "Rename this template (replaces example-repo placeholders, self-deletes script)"
run = "node scripts/init-template.mjs {{ arg(name=\"name\") }}"
# Example: mise run rename -- --name foo-mcp --scope @myorg
