name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PR-title/body release-token guard used to be a job here. It moved to
  # release-tokens.yml on 2026-09-04 because it has to re-run on the `edited`
  # event — a description edited after CI goes green is still what becomes the
  # squash commit message — and adding `edited` to THIS workflow would re-run
  # the whole matrix on every typo fix and let an edit cancel an in-flight run.
  build-test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # ONE FULL RUN, plus a platform-only second leg.
    #
    # Every step below that is not marked `platform surface` produces the same
    # answer on any runner — lint, docs, typecheck, the TS-fallback suite,
    # usage(1) freshness and npm pack are pure computation over the same files.
    # Running them twice buys a duplicate answer at 10x the price: GitHub bills
    # macOS at $0.08/min against $0.008 for Linux, and a NEW REPO FROM THIS
    # TEMPLATE IS PRIVATE, so those minutes are billed. In the template author's
    # account that multiplier ran a balance to ~$70, the card declined the
    # authorization, and Actions stopped for every repo they owned.
    #
    # The macOS leg keeps only what genuinely differs: `apps/rust-accel`
    # compiles a different `.node` per target, and the test + stress suites
    # spawn processes, signal them, and write under `tmpdir()`. That is where
    # the one real cross-OS divergence came from — macOS surfaced a defect in
    # this very harness (the tsx CLI SIGKILLs its grandchild when the child's
    # IPC signal-ack misses a 30ms window, which happens on a loaded runner and
    # never on an idle laptop) that Linux never surfaced in 30+ runs.
    #
    # ON A PRIVATE REPO, DELETE the macos-latest entry unless you ship
    # Darwin-only code. On a public repo standard runners are free, so keeping
    # it costs only wall-clock.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the build stamp counts commits with
          # `git rev-list --count HEAD`, and the default depth of 1 would make
          # every CI build report a count of 1 — wrong, but plausible enough to
          # be believed, which is the failure the stamp exists to prevent.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: pnpm lint

      - name: Docs integrity (links, agent-file symlinks, index coverage)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm check:docs

      - name: Stdout purity (no console.* in an MCP app's src — JSON-RPC owns stdout)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm check:stdout-purity

      - name: Typecheck
        if: matrix.os == 'ubuntu-latest'
        run: pnpm typecheck

      - name: Build (TS workspace + optional native)
        run: pnpm build

      # Platform surface: the suites spawn processes, signal them, write under
      # `tmpdir()`, and load the `.node` built for THIS target.
      - name: Test (default — native path when built)
        run: pnpm test

      - name: Test (TS fallback path)
        if: matrix.os == 'ubuntu-latest'
        env:
          MCP_DISABLE_NATIVE: "1"
        run: pnpm test:no-native

      - name: Install usage(1) via mise
        if: matrix.os == 'ubuntu-latest'
        # The freshness gate (next step) shells out to usage(1) to
        # regenerate completions + manpage + docs; mise pulls a pinned
        # binary so the check is reproducible across runners.
        uses: jdx/mise-action@v4

      - name: Check usage(1) artifacts are fresh vs .usage.kdl
        if: matrix.os == 'ubuntu-latest'
        # Fails the build if completions/, man/, or docs/cli/ drifted
        # since the last regen. Fix locally: `pnpm artifacts && git add
        # completions/ man/ docs/cli/`. Bypass: edit .usage.kdl + this
        # check together in the same PR.
        run: pnpm --filter "@george43g/*-mcp" check:usage

      - name: Verify npm tarball is publishable
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter "@george43g/*-mcp" exec npm pack --dry-run

      # Platform surface: spawns the server, signals it, asserts on exit.
      - name: Stress harness (15 assertions including HTTP)
        run: pnpm --filter "@george43g/*-mcp" stress

      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-report-${{ matrix.os }}
          path: apps/**/stress-*-report.json
          if-no-files-found: ignore
