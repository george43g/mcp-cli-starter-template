name: Screenshots

# Regenerates VHS-driven PNGs/GIFs whenever a .tape file changes on main.
# Skips on PRs unless the PR touches a .tape file (saves CI minutes).
# Commits regenerated assets back to docs/screenshots/ with [skip ci].

on:
  push:
    branches: [main]
    paths:
      - "apps/**/scripts/screenshots/*.tape"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**/scripts/screenshots/*.tape"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # See ci.yml: the build stamp's commit count needs full history.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.3
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install VHS
        # VHS publishes versioned assets (vhs_<ver>_Linux_x86_64.tar.gz)
        # rather than a stable "latest" path, so we pin to a known good
        # release. Bump VHS_VERSION to update; the tarball extracts to
        # vhs_<ver>_Linux_x86_64/vhs.
        env:
          VHS_VERSION: "0.11.0"
        run: |
          curl -sSL "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv "/tmp/vhs_${VHS_VERSION}_Linux_x86_64/vhs" /usr/local/bin/vhs
          vhs --version

      - name: Install ttyd (VHS runtime dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y ttyd ffmpeg

      - name: Build the tool (so VHS captures the real bin)
        run: pnpm build

      - name: Regenerate screenshots
        run: |
          mkdir -p docs/screenshots
          shopt -s nullglob
          status=0
          # Resolved so the comparison below is not defeated by a symlinked path.
          root="$(pwd -P)"
          for f in apps/*/scripts/screenshots/*.tape; do
            echo "▶ $f"
            # Run each tape from its OWN directory. vhs resolves `Output` and
            # `Screenshot` paths against the process working directory, not the
            # tape's location, so invoking `vhs apps/.../x.tape` from the repo
            # root sends the tape's ../../../../ prefix four levels ABOVE the
            # root — writing nothing, and still exiting 0.
            if ! ( cd "$(dirname "$f")" && vhs "$(basename "$f")" ); then
              echo "::error file=$f::vhs exited non-zero"
              status=1
              continue
            fi
            # An exit code is not enough on its own. vhs returns 0 when it
            # cannot write its output at all, and it silently creates parent
            # directories — so a wrong relative path either writes nothing or
            # writes somewhere unexpected, and both look like success.
            # Assert that every artifact the tape declares exists AND landed in
            # docs/screenshots/.
            while read -r out; do
              artifact="$(dirname "$f")/$out"
              if [[ ! -s "$artifact" ]]; then
                echo "::error file=$f::declared '$out' but it is missing or empty"
                status=1
                continue
              fi
              resolved="$(cd "$(dirname "$artifact")" && pwd -P)"
              if [[ "$resolved" != "$root/docs/screenshots" ]]; then
                echo "::error file=$f::'$out' resolved to $resolved, outside docs/screenshots/"
                status=1
              fi
            done < <(awk '$1 == "Output" || $1 == "Screenshot" { print $2 }' "$f")
          done
          # A bare `for` loop exits with the LAST iteration's status, so a tape
          # that fails anywhere but the end used to be reported as success.
          exit $status

      - name: Commit regenerated screenshots (push only)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain docs/screenshots/) ]]; then
            git add docs/screenshots/
            git commit -m "chore(screenshots): regenerate via VHS [skip ci]"
            git push
          else
            echo "No screenshot changes to commit."
          fi
