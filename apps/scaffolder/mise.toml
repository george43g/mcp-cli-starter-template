# mise tasks for the scaffolder dev loop.
#
# Run with `mise run <task>` from inside apps/scaffolder/ (or via
# `mise run --cd apps/scaffolder <task>` from the repo root).
#
# Docs: https://mise.jdx.dev

[tasks.build]
description = "Codegen + vite build"
run = "pnpm build"

[tasks.dev]
description = "Watch-mode build"
run = "pnpm dev"

[tasks.typecheck]
description = "tsc --noEmit"
run = "pnpm typecheck"

[tasks.test]
description = "Run vitest"
run = "pnpm test"

[tasks.smoke]
description = "End-to-end smoke: scaffold into /tmp + assert tests pass"
run = """
  set -euo pipefail
  rm -rf /tmp/scaffold-smoke
  mkdir /tmp/scaffold-smoke
  node dist/cli.js init /tmp/scaffold-smoke --name smoke --no-banner
  cd /tmp/scaffold-smoke
  pnpm install --silent
  pnpm test
"""

[tasks.docs]
description = "Generate markdown docs for each subcommand"
run = """
  set -euo pipefail
  mkdir -p ../../docs/scaffolder-cli
  usage g markdown -f .usage.kdl -m --out-dir ../../docs/scaffolder-cli/
"""

[tasks."completions:bash"]
description = "Generate bash completion script"
run = "mkdir -p ../../completions/scaffolder && usage g completion bash mcp-scaffold -f .usage.kdl > ../../completions/scaffolder/mcp-scaffold.bash"

[tasks."completions:zsh"]
description = "Generate zsh completion script"
run = "mkdir -p ../../completions/scaffolder && usage g completion zsh mcp-scaffold -f .usage.kdl > ../../completions/scaffolder/_mcp-scaffold"

[tasks."completions:fish"]
description = "Generate fish completion script"
run = "mkdir -p ../../completions/scaffolder && usage g completion fish mcp-scaffold -f .usage.kdl > ../../completions/scaffolder/mcp-scaffold.fish"

[tasks.completions]
description = "Generate completions for bash, zsh, and fish"
depends = ["completions:bash", "completions:zsh", "completions:fish"]
run = "echo 'completions generated in completions/scaffolder/'"

[tasks.manpage]
description = "Generate man page"
run = "mkdir -p ../../man && usage g manpage -f .usage.kdl -o ../../man/mcp-scaffold.1"
