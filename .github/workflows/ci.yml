name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Squash-merging makes the PR title + body the commit message, and
  # semantic-release reads a release-control token anywhere in that body. So
  # this has to run BEFORE the merge — afterwards the package is already
  # published and npm versions are immutable.
  release-tokens:
    name: Commit message cannot trigger an unintended release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check PR title + body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s' "$PR_TITLE" "$PR_BODY" | node scripts/check-release-tokens.mjs

  build-test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the build stamp counts commits with
          # `git rev-list --count HEAD`, and the default depth of 1 would make
          # every CI build report a count of 1 — wrong, but plausible enough to
          # be believed, which is the failure the stamp exists to prevent.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Docs integrity (links, agent-file symlinks, index coverage)
        run: pnpm check:docs

      - name: Repo script unit tests (runs before the checks that depend on them)
        run: pnpm test:scripts

      - name: Publish shape (repository metadata, shipped dep specifiers)
        run: pnpm check:publishable-manifests

      - name: Registry boundary (generated-app imports vs the released surface)
        run: pnpm check:registry-boundary

      - name: Workflow YAML lint (all three surfaces)
        run: pnpm check:workflows

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (TS workspace + optional native)
        run: pnpm build

      - name: Test + coverage gates (default — native path when built)
        # `test:coverage`, not `test`: it runs the same suites with v8
        # instrumentation and then enforces each workspace's thresholds.
        # Running plain `test` here as well would just execute everything
        # twice. Until 2026-08-09 the thresholds had never executed at all —
        # @vitest/coverage-v8 was not installed and no script passed
        # --coverage — so this step is what makes them real.
        run: pnpm test:coverage

      - name: Test (TS fallback path)
        env:
          MCP_DISABLE_NATIVE: "1"
        run: pnpm test:no-native

      - name: Install usage(1) via mise
        # The freshness gate (next step) shells out to usage(1) to
        # regenerate completions + manpage + docs; mise pulls a pinned
        # binary so the check is reproducible across runners.
        uses: jdx/mise-action@v4

      - name: Check usage(1) artifacts are fresh vs .usage.kdl
        # Covers both the mcp-scaffold CLI and every generated CLI app.
        # Fix locally: `pnpm --filter @george43g/mcp-scaffold artifacts`
        # and/or `pnpm --filter "@george43g/*-mcp" artifacts`.
        run: pnpm check:usage

      - name: Verify npm tarball is publishable
        run: |
          pnpm --filter "@george43g/*-mcp" exec npm pack --dry-run
          pnpm --filter @george43g/cli-kit --filter @george43g/tui-kit exec npm pack --dry-run

      - name: Scaffolder E2E smoke (init → install → test)
        # Asserts the scaffolder's actual OUTPUT is buildable + testable,
        # not just that its own unit tests pass. Catches regressions where
        # the scaffolder lints + tests fine but emits broken workspace.
        # --no-rust-accel skips the napi crate in the scaffolded output so
        # the smoke runs in seconds (we still test Rust on the canonical
        # apps/rust-accel/ via the main build step).
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          echo "Scaffolding into $SMOKE_DIR"
          node apps/scaffolder/dist/cli.js init "$SMOKE_DIR" \
            --name golden --no-banner --no-rust-accel
          cd "$SMOKE_DIR"
          # --no-frozen-lockfile because the scaffolded output has no
          # pnpm-lock.yaml yet; pnpm defaults to frozen in CI environments.
          pnpm install --no-frozen-lockfile
          # Lint + typecheck + test + build — the same gates a consumer
          # would hit running `pnpm verify` immediately after init. Each
          # catches a different class of "scaffolder unit tests pass but
          # output is broken" regression.
          pnpm verify
          # Stress: 13 lifecycle assertions (handshake, health, parallel,
          # timeout, SIGTERM, RSS watchdog, HTTP roundtrip). Skipped if
          # --no-rust-accel removed the http transport; we kept HTTP in
          # this run so all 13 must pass.
          pnpm --filter "@george43g/*-mcp" stress

      - name: Stress harness (13 assertions including HTTP)
        run: pnpm --filter "@george43g/*-mcp" stress

      - name: Example/ output stays in sync with scaffolder
        # Regenerate into a tempdir and diff against the committed example/.
        # Catches scaffolder changes (or .usage.kdl changes) that weren't
        # accompanied by `pnpm regen:example`.
        # Fix locally: `pnpm regen:example && git add example/ && git commit`.
        #
        # This step used to re-implement `regen:example` inline, and its own
        # comment admitted the two hand-synced copies were how it drifted
        # (DEFERRED #17). Both now call scripts/regen-example.mjs, which is
        # also what the release workflow uses to refresh example/ after a
        # version bump.
        #
        # No --build: the matrix already built the scaffolder in an earlier
        # step, and its dist is current for this commit.
        run: |
          set -euo pipefail
          EXAMPLE_TMP="$(mktemp -d)"
          node scripts/regen-example.mjs "$EXAMPLE_TMP"
          # The committed side is not regenerated, so strip its transient
          # artifacts too before comparing content.
          node scripts/regen-example.mjs --prune example
          if ! diff -r --no-dereference "$EXAMPLE_TMP" example; then
            echo "::error::example/ is stale vs scaffolder output. Run \`pnpm regen:example\` and commit."
            exit 1
          fi

      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-report-${{ matrix.os }}
          path: apps/**/stress-*-report.json
          if-no-files-found: ignore
