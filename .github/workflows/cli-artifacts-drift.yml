name: CLI Artifacts Drift

# Regenerates docs/scaffolder-cli/*, completions/scaffolder/*, and
# man/mcp-scaffold.1 from apps/scaffolder/.usage.kdl. Fails if the
# committed files differ from the regenerated ones — i.e. someone
# updated the spec without re-running the generators.
#
# Lightweight: only runs when the spec OR a generated artifact changes,
# and on main pushes. Skips otherwise.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/scaffolder/.usage.kdl"
      - "docs/scaffolder-cli/**"
      - "completions/scaffolder/**"
      - "man/**"
      - ".github/workflows/cli-artifacts-drift.yml"
  pull_request:
    paths:
      - "apps/scaffolder/.usage.kdl"
      - "docs/scaffolder-cli/**"
      - "completions/scaffolder/**"
      - "man/**"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install mise (provides usage)
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # Invoke the same mise tasks the failure message instructs developers
      # to run locally — they're the source-of-truth for how the artifacts
      # are produced (cwd = apps/scaffolder, so `-f .usage.kdl`). Running
      # `usage` inline from the repo root with `-f apps/scaffolder/.usage.kdl`
      # produces a different `# @generated by usage-cli from <path>` header
      # and tripped the drift check.
      - name: Regenerate markdown docs
        run: mise run --cd apps/scaffolder docs

      - name: Regenerate completions
        run: mise run --cd apps/scaffolder completions

      - name: Regenerate manpage
        run: mise run --cd apps/scaffolder manpage

      - name: Fail if anything drifted
        run: |
          if ! git diff --exit-code -- docs/scaffolder-cli completions/scaffolder man; then
            echo "::error::CLI artifacts are out of sync with apps/scaffolder/.usage.kdl"
            echo "::error::Run \`mise run --cd apps/scaffolder docs && mise run --cd apps/scaffolder completions && mise run --cd apps/scaffolder manpage\` locally and commit."
            exit 1
          fi
          echo "CLI artifacts are in sync."
