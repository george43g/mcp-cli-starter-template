name: Release reusable packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      - name: Verify packed package in a standalone consumer
        run: pnpm check:robustness-package

      - name: Publish @george43g/robustness
        if: inputs.publish
        run: pnpm --filter @george43g/robustness publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
