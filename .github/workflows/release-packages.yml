# Release pipeline for the reusable packages (currently @george43g/robustness).
#
# Publishing uses npm OIDC trusted publishing — there is NO NPM_TOKEN secret.
# On npmjs.com, the package's Trusted Publisher (GitHub Actions) must be:
#   organization/user: george43g
#   repository:        mcp-cli-starter-template
#   workflow filename: release-packages.yml
#   environment:       (leave empty)
#
# semantic-release drives versioning from Conventional Commits touching
# packages/robustness (semantic-release-monorepo filters commits by package
# path), writes CHANGELOG.md, commits the version bump back to main with
# [skip ci], tags robustness-v<version>, publishes to npm with build
# provenance (NPM_CONFIG_PROVENANCE below — trusted publishing did NOT emit
# provenance on its own, so it is requested explicitly; the id-token: write
# permission supplies the OIDC token npm needs to attest), and creates the
# GitHub release. The full verification matrix runs first — a red step means
# no publish.

name: Release reusable packages

on:
  push:
    branches: [main]
    paths:
      - "packages/robustness/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      # No registry-url here: setup-node would write an .npmrc line resolving
      # a placeholder NODE_AUTH_TOKEN, and that bogus token shadows the OIDC
      # exchange (npm sends it and gets 401 instead of doing trusted
      # publishing). @semantic-release/npm must be >= 13.1.0 to detect the
      # Actions OIDC environment itself — v12.x (the version semantic-release
      # core bundles as its default plugin) has no OIDC awareness at all and
      # always demands NPM_TOKEN, so packages/robustness/package.json pins an
      # explicit ^13.1.5 devDependency to override that default resolution.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Show npm version (OIDC trusted publishing needs >= 11.5.1)
        run: npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (lint + docs + typecheck + unit/integration tests + build)
        run: pnpm verify

      - name: Test (TS fallback path)
        run: pnpm test:no-native

      - name: E2E — packed standalone-consumer smoke
        run: pnpm check:robustness-package

      - name: E2E — 13-assertion MCP stress harness
        run: pnpm stress

      - name: Release (semantic-release → npm via OIDC + GitHub release)
        run: pnpm --filter @george43g/robustness exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Request build provenance at publish time. Kept out of the package's
          # publishConfig on purpose: publishConfig.provenance:true also fires
          # on local `pnpm publish`, which has no CI OIDC provider and fails
          # ("provenance generation not supported for provider: null"). Scoping
          # it to this CI step keeps local publishes working.
          NPM_CONFIG_PROVENANCE: "true"
