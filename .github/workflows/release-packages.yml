# Release pipeline for the published packages:
#   @george43g/robustness  (packages/robustness)
#   @george43g/cli-kit     (packages/cli-kit)
#   @george43g/tui-kit     (packages/tui-kit)
#   @george43g/secret-store (packages/secret-store — env → .env → OS keychain →
#                           exec. No vault vendor code; see DEFERRED.md #11)
#   @george43g/mcpsync     (apps/mcpsync — bin `mcpsync`; still bundles the
#                           kits into its dist, see DEFERRED.md #10)
#
# Publishing uses npm OIDC trusted publishing — there is NO NPM_TOKEN secret.
# On npmjs.com, EACH package's Trusted Publisher (GitHub Actions) must be:
#   organization/user: george43g
#   repository:        mcp-cli-starter-template
#   workflow filename: release-packages.yml
#   environment:       (leave empty)
# (Trusted publishing config requires the package to already exist — each new
# package needs a one-time manual `pnpm publish` bootstrap, like robustness
# 0.1.0 and the kits' 0.1.0 were. npm/cli#8544 tracks removing that step.)
#
# BUILD PROVENANCE IS ON, as of 2026-08-21, and it is conditional on one fact:
# THIS REPOSITORY IS PUBLIC. npm dropped provenance for private source repos in
# 2023, and requesting it from one returns 422 and FAILS THE PUBLISH OUTRIGHT
# rather than degrading (field-note 23) — so if this repo is ever made private
# again, every `NPM_CONFIG_PROVENANCE: "true"` below has to come out in the
# same change or the next release dies at the publish step.
#
# The registry also validates `repository.url` against the signing certificate
# CASE-SENSITIVELY. All five manifests were checked against the live repo on
# enabling, and `scripts/check-publishable-manifests.mjs` enforces the exact
# string on every CI run, so that half is mechanically held.
#
# Do NOT move this into `publishConfig`. That fires on a local `pnpm publish`
# too — which has no OIDC provider and fails (field-note 10) — and a local
# publish is exactly how a NEW package gets bootstrapped here.
#
# mcpsync's npm publish is DEFERRED (user decision 2026-08-03): the package is
# publish-ready but not yet bootstrapped, so its job only runs on manual
# workflow_dispatch and pushes touching apps/mcpsync do not trigger this
# workflow. To start publishing: bootstrap 0.1.0 from apps/mcpsync, add the
# trusted publisher on npmjs.com, then run this workflow manually (and
# optionally restore `apps/mcpsync/**` to the push paths + drop the job's
# `if:` guard for automatic releases).
#
# semantic-release drives versioning from Conventional Commits touching each
# package's directory (semantic-release-monorepo filters commits by package
# path), writes CHANGELOG.md, commits the version bump back to main with
# [skip ci], tags <pkg>-v<version>, publishes to npm, and creates the GitHub
# release. The full verification matrix runs first — a red step means no
# publish. Jobs are chained with `needs` rather than run in parallel: each
# semantic-release pushes a bump commit to main, and concurrent pushes race.

name: Release reusable packages

on:
  push:
    branches: [main]
    paths:
      - "packages/robustness/**"
      - "packages/cli-kit/**"
      - "packages/tui-kit/**"
      - "packages/secret-store/**"
      # Test and tooling files live INSIDE these directories but are not part
      # of any published tarball, so a change to one must not cut a release.
      # This is not hypothetical: a commit titled `feat(vitest-config): make
      # the coverage gates actually run` edited three packages' vitest.config
      # and one test file, and semantic-release-monorepo — which filters by
      # PATH, not by the scope in the subject line — read it as a feature for
      # each of them and published robustness 0.3.0.
      - "!packages/*/vitest.config.ts"
      - "!packages/*/**/*.test.ts"
      - "!packages/*/**/*.test.tsx"
      # Written BY the release itself. Without this, a release's own bump
      # commit is a candidate trigger for the next one.
      - "!packages/*/CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  # The guard that has to be ON THIS PATH, not only on pull_request.
  #
  # ci.yml runs the same check against a PR's title + body, which covers the
  # squash-merge case. It does not cover a direct push: `main` is NOT a
  # protected branch (the branch-protection API returns 404), so a push never
  # opens a PR and never meets that check. A merger can also edit a squash
  # commit's message at merge time, which makes the PR body a prediction of the
  # commit message rather than the commit message itself.
  #
  # Every release job below `needs:` this one, so a bad message blocks the
  # publish. That is the only remedy available — npm versions are immutable, and
  # a `docs:` commit whose PROSE spelled the footer token has already published
  # one unintended major here.
  release-tokens:
    name: Commit messages cannot trigger an unintended release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check every commit message being released
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: node scripts/check-release-tokens.mjs --range "${BEFORE:-}..${SHA}"

  robustness:
    runs-on: ubuntu-latest
    needs: release-tokens
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Tip of main, not the triggering SHA — same as every job below. On a
          # normal push these are identical, but on a RE-RUN of an older run the
          # triggering SHA is stale, and semantic-release then refuses with "The
          # local branch main is behind the remote one, therefore a new version
          # won't be published" — a green run that silently releases nothing.
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      # No registry-url here: setup-node would write an .npmrc line resolving
      # a placeholder NODE_AUTH_TOKEN, and that bogus token shadows the OIDC
      # exchange (npm sends it and gets 401 instead of doing trusted
      # publishing). @semantic-release/npm must be >= 13.1.0 to detect the
      # Actions OIDC environment itself — v12.x (the version semantic-release
      # core bundles as its default plugin) has no OIDC awareness at all and
      # always demands NPM_TOKEN. A devDependency in the package CANNOT fix
      # that: .releaserc.json plugin names resolve from inside semantic-release's
      # own install location and never reach the consuming package. The root
      # package.json's `pnpm.overrides` entry ("@semantic-release/npm":
      # "^13.1.5") is what actually forces it graph-wide (field-note 15).
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Show npm version (OIDC trusted publishing needs >= 11.5.1)
        run: npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install actionlint via mise
        # `pnpm verify` includes check:workflows, and actionlint is pinned in
        # mise.toml — it is not on PATH until mise installs it. Without this the
        # release path fails at Verify with `actionlint: not found`, which is
        # how it failed on 2026-08-10: the check was added to verify for CI,
        # where a mise step already existed, and the release jobs had none.
        uses: jdx/mise-action@v4

      - name: Verify (lint + docs + typecheck + unit/integration tests + build)
        run: pnpm verify

      - name: Test (TS fallback path)
        run: pnpm test:no-native

      - name: E2E — packed standalone-consumer smoke
        run: pnpm check:robustness-package

      - name: E2E — 15-assertion MCP stress harness
        run: pnpm stress

      - name: Release (semantic-release → npm via OIDC + GitHub release)
        run: pnpm --filter @george43g/robustness exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only valid while the repo is public — see the header. This is not a
          # no-op on a private repo; it 422s the publish.
          NPM_CONFIG_PROVENANCE: "true"

  # Every job below is serialized behind the previous one (`needs`). Each
  # semantic-release pushes a [skip ci] bump commit to main, and concurrent
  # pushes would race. The semantic-release-monorepo path filter means a push
  # touching only one package produces a release only for that package; the
  # other jobs no-op cheaply.
  cli-kit:
    runs-on: ubuntu-latest
    needs: robustness
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Tip of main, not the triggering SHA: an earlier job may have moved
          # main by its bump commit, and semantic-release must sit on top of it.
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Show npm version (OIDC trusted publishing needs >= 11.5.1)
        run: npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install actionlint via mise
        # `pnpm verify` includes check:workflows, and actionlint is pinned in
        # mise.toml — it is not on PATH until mise installs it. Without this the
        # release path fails at Verify with `actionlint: not found`, which is
        # how it failed on 2026-08-10: the check was added to verify for CI,
        # where a mise step already existed, and the release jobs had none.
        uses: jdx/mise-action@v4

      - name: Verify (lint + docs + manifests + typecheck + tests + build)
        run: pnpm verify

      - name: Pack sanity (dist + types + README/LICENSE in the tarball)
        run: pnpm --filter @george43g/cli-kit pack:check

      - name: Release (semantic-release → npm via OIDC + GitHub release)
        run: pnpm --filter @george43g/cli-kit exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  tui-kit:
    runs-on: ubuntu-latest
    needs: cli-kit
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Show npm version (OIDC trusted publishing needs >= 11.5.1)
        run: npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install actionlint via mise
        # `pnpm verify` includes check:workflows, and actionlint is pinned in
        # mise.toml — it is not on PATH until mise installs it. Without this the
        # release path fails at Verify with `actionlint: not found`, which is
        # how it failed on 2026-08-10: the check was added to verify for CI,
        # where a mise step already existed, and the release jobs had none.
        uses: jdx/mise-action@v4

      - name: Verify (lint + docs + manifests + typecheck + tests + build)
        run: pnpm verify

      - name: Pack sanity (dist + types + README/LICENSE in the tarball)
        run: pnpm --filter @george43g/tui-kit pack:check

      - name: Release (semantic-release → npm via OIDC + GitHub release)
        run: pnpm --filter @george43g/tui-kit exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  secret-store:
    runs-on: ubuntu-latest
    needs: tui-kit
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      # `pnpm verify` runs check:workflows, whose actionlint is pinned in
      # mise.toml and is not on PATH until mise installs it. (This step used to
      # serve the example/ resync as well; that moved to its own job.)
      - name: Setup mise (actionlint for verify)
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Show npm version (OIDC trusted publishing needs >= 11.5.1)
        run: npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (lint + docs + manifests + typecheck + tests + build)
        run: pnpm verify

      - name: Pack sanity (dist + src + types + README/LICENSE in the tarball)
        run: pnpm --filter @george43g/secret-store pack:check

      - name: Release (semantic-release → npm via OIDC + GitHub release)
        run: pnpm --filter @george43g/secret-store exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  # ── example/ resync (DEFERRED #22, relocated out of secret-store by #38) ──
  #
  # Its own job, and the `if:` is the entire point of the relocation.
  #
  # These two steps used to sit at the end of the `secret-store` job. `needs:`
  # skips a job when ANY upstream job fails, so the resync was removed from the
  # run precisely when a release had gone half-finished — the only time it
  # matters. Observed three times in three days: 2026-08-16 (harmless by luck,
  # a PR had regenerated example/ in passing); 2026-08-18, when
  # `robustness@0.9.0` published and `cli-kit` then failed at the RUNNER level,
  # leaving example/ claiming `^0.8.1` against a published `0.9.0`; and
  # 2026-08-20, when that stale output failed CI on a docs-only PR that touched
  # no code at all and blocked it behind an unrelated fix.
  #
  # `!cancelled()` rather than the `always()` DEFERRED #38 specified: ANY `if:`
  # that does not call `success()` already breaks the skip-cascade, so both
  # forms fix the bug — but this one additionally declines to push a commit
  # into a run somebody deliberately cancelled.
  #
  # `needs` lists the four PUSH jobs and deliberately omits `mcpsync`, which is
  # `workflow_dispatch`-only: a job hung off it would be skipped on every push,
  # which is the original bug wearing a different hat.
  resync-example:
    name: Resync example/ whatever the release jobs did
    needs: [robustness, cli-kit, tui-kit, secret-store]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Tip of main, so this sees every bump commit the jobs above pushed —
          # including the ones from a run that failed partway.
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup mise (usage(1) for the resync)
        # regen-example runs the usage(1) tasks (docs, completions, manpage)
        # inside the scaffolded output; usage is pinned in mise.toml.
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resync example/ against the freshly bumped versions
        run: |
          set -euo pipefail
          # --build is required, not an optimisation: the scaffolder must be
          # rebuilt AFTER semantic-release bumped the versions, or its dist
          # still embeds the old dependency ranges.
          node scripts/regen-example.mjs example --build

      - name: Commit the resync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z $(git status --porcelain example/) ]]; then
            echo "example/ already in sync — nothing to commit."
            exit 0
          fi
          git add example/
          git commit -m "chore(example): resync generated output after release [skip ci]"
          # semantic-release pushed its own bump commits to main during this
          # run, and main is unprotected, so a human merge can land between
          # this job's checkout and this push. Rebase rather than fail the run.
          git pull --rebase origin main
          git push

  mcpsync:
    # Publish deferred — manual dispatch only until the 0.1.0 bootstrap +
    # trusted-publisher config exist (see header).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: secret-store
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Show npm version (OIDC trusted publishing needs >= 11.5.1)
        run: npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install actionlint via mise
        # `pnpm verify` includes check:workflows, and actionlint is pinned in
        # mise.toml — it is not on PATH until mise installs it. Without this the
        # release path fails at Verify with `actionlint: not found`, which is
        # how it failed on 2026-08-10: the check was added to verify for CI,
        # where a mise step already existed, and the release jobs had none.
        uses: jdx/mise-action@v4

      - name: Verify (lint + docs + manifests + typecheck + tests + build)
        run: pnpm verify

      - name: Pack sanity (bin + dist + types present in the tarball)
        run: pnpm --filter @george43g/mcpsync pack:check

      - name: Release (semantic-release → npm via OIDC + GitHub release)
        run: pnpm --filter @george43g/mcpsync exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
